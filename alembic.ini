# ============================================================
# Alembic config (TyAgent / GeoAgent)
#
# NOTE: This file MUST stay ASCII-only.
# Windows configparser reads it with the system locale (GBK on
# Simplified Chinese Windows) and chokes on UTF-8 bytes. Any
# context / rationale that needs Chinese belongs in alembic/env.py
# (UTF-8, imported by Python) or README.md.
#
# Design notes (kept in English here on purpose):
# - sqlalchemy.url is intentionally empty. env.py injects the URL
#   from app.core.config.get_settings().database_url so that
#   alembic.ini never drifts from .env.
# - prepend_sys_path = . lets env.py do `from app.xxx` imports.
# - file_template prefixes versions with the date so `ls` /
#   `git diff` shows them in chronological order.
#
# Common commands (see README.md section 2.5):
#   alembic upgrade head
#   alembic stamp head               # mark current state without running SQL
#   alembic revision --autogenerate -m "<slug>"
#   alembic downgrade -1
# ============================================================

[alembic]
# Where migration scripts live.
script_location = alembic

# Make project code importable from env.py (app.core.config / app.models).
prepend_sys_path = .

# Versioned filenames: YYYYMMDD_<rev>_<slug>.py
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s

# Timezone used by year/month/day tokens in file_template.
timezone = Asia/Shanghai

# DB URL is set by env.py at runtime; leave empty here on purpose.
sqlalchemy.url =


# ============================================================
# Logging (alembic default template)
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
